# Tag-triggered npm releases, one track per tag:
#   v1-plugin-vX.Y.Z[-pre]  ->  opencode-dynamic-custom-providers     (repo root)
#   v2-plugin-vX.Y.Z[-pre]  ->  opencode-dynamic-custom-providers-v2  (packages/v2)
# The unprivileged `verify` job selects the track, tests, packs once and validates the tarball.
# Only the matching publish job runs; it holds id-token: write (npm trusted publishing / OIDC),
# runs no repository code and publishes the exact verified tarball. See RELEASING.md for the
# required GitHub environment and npm trusted-publisher setup.
name: Publish

on:
  push:
    tags:
      - "v1-plugin-v*"
      - "v2-plugin-v*"

permissions: {}

# One release at a time per track; never cancel a running release.
concurrency:
  group: npm-publish-${{ startsWith(github.ref_name, 'v2-plugin-v') && 'v2' || 'v1' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.21.0" # Node 24 LTS; bundles npm 11.19.0 (trusted publishing needs >= 11.5.1)
  NPM_VERSION: "11.19.0"
  NPM_REGISTRY: "https://registry.npmjs.org/"

jobs:
  verify:
    name: Verify release tag and tarball
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      track: ${{ steps.select.outputs.track }}
      name: ${{ steps.select.outputs.name }}
      version: ${{ steps.select.outputs.version }}
      dist_tag: ${{ steps.select.outputs.dist_tag }}
      tarball: ${{ steps.select.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for the default-branch ancestry check
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # never cache in release builds
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
      - name: Test release helpers
        run: node --test scripts/ci/release.test.mjs
      - name: Select release from tag
        id: select
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/ci/release.mjs select --tag "$TAG" --ref "$GITHUB_REF"
      - name: Require the tagged commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base="refs/remotes/origin/${DEFAULT_BRANCH}"
          git rev-parse --verify --quiet "${base}^{commit}" >/dev/null || {
            echo "::error::default branch ${DEFAULT_BRANCH} was not fetched"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" "$base" || {
            echo "::error::tagged commit ${GITHUB_SHA} is not on ${DEFAULT_BRANCH}; merge first, then tag"
            exit 1
          }
      - name: Check the dist-tag line (anonymous registry read)
        env:
          TRACK: ${{ steps.select.outputs.track }}
          VERSION: ${{ steps.select.outputs.version }}
        run: node scripts/ci/release.mjs check-latest --track "$TRACK" --version "$VERSION" --registry "$NPM_REGISTRY"
      - name: Install (frozen lockfile, no lifecycle scripts)
        working-directory: ${{ steps.select.outputs.dir }}
        run: npm ci --ignore-scripts
      - name: Typecheck
        if: steps.select.outputs.track == 'v2'
        working-directory: ${{ steps.select.outputs.dir }}
        run: npm run typecheck
      - name: Build and test
        working-directory: ${{ steps.select.outputs.dir }}
        run: npm test
      - name: Check the other track's output was not built
        env:
          TRACK: ${{ steps.select.outputs.track }}
        run: |
          if [ "$TRACK" = v1 ]; then test ! -e packages/v2/dist; else test ! -e dist; fi
      - name: Pack once
        id: pack
        env:
          TRACK: ${{ steps.select.outputs.track }}
          EXPECTED: ${{ steps.select.outputs.tarball }}
        run: |
          node scripts/ci/release.mjs pack --track "$TRACK" --out-dir "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/pack.out"
          grep -qxF "filename=${EXPECTED}" "$RUNNER_TEMP/pack.out"
      - name: Verify tarball boundary and identity
        env:
          TRACK: ${{ steps.select.outputs.track }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/ci/release.mjs verify-tarball --track "$TRACK" --tarball "$TARBALL"
      - name: Verify production-only consumer install and imports
        env:
          TRACK: ${{ steps.select.outputs.track }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/ci/release.mjs verify-consumer --track "$TRACK" --tarball "$TARBALL"
      - name: Re-check tarball digest after verification
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: echo "${SHA256}  ${TARBALL}" | sha256sum -c -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  publish-v1:
    name: Publish opencode-dynamic-custom-providers
    needs: verify
    if: needs.verify.outputs.track == 'v1' && startsWith(github.ref, 'refs/tags/v1-plugin-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm-release-v1
      url: https://www.npmjs.com/package/opencode-dynamic-custom-providers
    permissions:
      id-token: write # npm trusted publishing (OIDC); no npm token is used
    env:
      EXPECTED_NAME: opencode-dynamic-custom-providers
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
      TARBALL: ${{ needs.verify.outputs.tarball }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-tarball
          path: ${{ runner.temp }}/release
      - name: Publish the verified tarball
        working-directory: ${{ runner.temp }}/release
        run: |
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          [ "${TARBALL}" = "${EXPECTED_NAME}-${VERSION}.tgz" ] || { echo "::error::${TARBALL} is not ${EXPECTED_NAME}-${VERSION}.tgz"; exit 1; }
          tar -xzOf "${TARBALL}" package/package.json \
            | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{const p=JSON.parse(s);if(p.name!==process.env.EXPECTED_NAME||p.version!==process.env.VERSION){console.error("::error::tarball is "+p.name+"@"+p.version);process.exit(1)}})'
          case "${VERSION}" in *-*) want=next ;; *) want=latest ;; esac
          [ "${DIST_TAG}" = "${want}" ] || { echo "::error::dist-tag ${DIST_TAG} for ${VERSION}, expected ${want}"; exit 1; }
          # Registry guard, re-run on every attempt (a "Re-run failed jobs" retry skips `verify`):
          # identical bytes already published -> no-op; different bytes -> fail; then a fresh,
          # uncached dist-tags read: a stable release must be above the current `latest`, because
          # npm's own downgrade check is skipped when --tag is explicit. Any registry error or
          # malformed response fails closed; only a genuine 404 for both reads means "first publish".
          decision="$(node --input-type=module - <<'JS'
          import { createHash } from "node:crypto"
          import { readFileSync } from "node:fs"
          const { EXPECTED_NAME: name, VERSION: version, TARBALL: tarball, NPM_REGISTRY: registry } = process.env
          const fail = (m) => { console.error(`::error::${name}@${version}: ${m}`); process.exit(1) }
          const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v)
          async function read(path) {
            const url = new URL(path, registry)
            let res, body
            try {
              res = await fetch(url, { headers: { accept: "application/json", "cache-control": "no-cache" }, signal: AbortSignal.timeout(30000) })
              body = JSON.parse(await res.text())
            } catch (e) { fail(`registry read ${url} failed: ${e.message}`) }
            if (res.status === 404 && /^not found$/i.test(String(isObj(body) ? body.error : body))) return null
            if (res.status !== 200 || !isObj(body)) fail(`registry read ${url} returned HTTP ${res.status} ${JSON.stringify(body).slice(0, 200)}`)
            return body
          }
          // Strict SemVer 2.0.0 as in scripts/ci/release.mjs, plus build metadata (ignored for precedence).
          // Strings only, at most 256 chars (npm's limit) before the regex runs.
          const NUM = "0|[1-9]\\d*", PRE = "0|[1-9]\\d*|\\d*[A-Za-z-][0-9A-Za-z-]*", BUILD = "[0-9A-Za-z-]+"
          const SEMVER = new RegExp(`^(${NUM})\\.(${NUM})\\.(${NUM})(?:-((?:${PRE})(?:\\.(?:${PRE}))*))?(?:\\+${BUILD}(?:\\.${BUILD})*)?$`)
          const parse = (v) => (typeof v === "string" && v.length <= 256 && SEMVER.exec(v)) || fail(`malformed registry version ${JSON.stringify(v)}`)
          // No leading zeros, so numeric identifiers compare exactly by length, then text (no Number()).
          const cmpNum = (a, b) => a.length - b.length || (a < b ? -1 : a > b ? 1 : 0)
          const packument = await read(encodeURIComponent(name))
          // Only a genuine 404 means "no versions yet"; a successful packument must list its versions.
          const versions = packument === null ? {} : packument.versions
          if (packument !== null && !(isObj(versions) && Object.keys(versions).length > 0)) fail("malformed packument versions")
          if (Object.hasOwn(versions, version)) {
            const published = versions[version]?.dist?.integrity
            if (typeof published !== "string") fail("malformed packument: no dist.integrity")
            if (published === `sha512-${createHash("sha512").update(readFileSync(tarball)).digest("base64")}`) {
              console.log("noop")
              process.exit(0)
            }
            fail("already published with different contents; versions are immutable, bump and re-tag")
          }
          const tags = await read(`-/package/${encodeURIComponent(name)}/dist-tags`)
          if ((tags === null) !== (packument === null)) fail("registry packument and dist-tags disagree about whether the package exists; retry later")
          const y = parse(version)
          if (!y[4]) {
            const latest = [tags?.latest, packument?.["dist-tags"]?.latest].filter((v) => v !== undefined)
            if (tags && !Object.hasOwn(tags, "latest")) fail("package exists but has no latest dist-tag")
            for (const l of latest) {
              const x = parse(l)
              const d = cmpNum(x[1], y[1]) || cmpNum(x[2], y[2]) || cmpNum(x[3], y[3])
              if (d > 0 || (d === 0 && !x[4])) fail(`current latest is ${l}; publishing ${version} with --tag latest would not move latest forward`)
            }
          }
          console.log("publish")
          JS
          )" || exit 1
          case "${decision}" in
            noop) echo "::notice::${EXPECTED_NAME}@${VERSION} is already published with this exact tarball; nothing to do"; exit 0 ;;
            publish) ;;
            *) echo "::error::unexpected registry guard result ${decision}"; exit 1 ;;
          esac
          npm publish "./${TARBALL}" --access public --tag "${DIST_TAG}" --registry "${NPM_REGISTRY}" --provenance --ignore-scripts

  publish-v2:
    name: Publish opencode-dynamic-custom-providers-v2
    needs: verify
    if: needs.verify.outputs.track == 'v2' && startsWith(github.ref, 'refs/tags/v2-plugin-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm-release-v2
      url: https://www.npmjs.com/package/opencode-dynamic-custom-providers-v2
    permissions:
      id-token: write # npm trusted publishing (OIDC); no npm token is used
    env:
      EXPECTED_NAME: opencode-dynamic-custom-providers-v2
      VERSION: ${{ needs.verify.outputs.version }}
