              if (d > 0 || (d === 0 && !x[4])) fail(`current latest is ${l}; publishing ${version} with --tag latest would not move latest forward`)
            }
          }
          console.log("publish")
          JS
          )" || exit 1
          case "${decision}" in
            noop) echo "::notice::${EXPECTED_NAME}@${VERSION} is already published with this exact tarball; nothing to do"; exit 0 ;;
